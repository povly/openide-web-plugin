vm.option.add.exports.description=Обновляет \\&lt;module\\&gt; для экспорта \\&lt;package\\&gt; в \\&lt;target-module\\&gt;, независимо от декларации модуля. \\&lt;target-module\\&gt; может быть ALL-UNNAMED для экспорта во все неназванные модули.
vm.option.add.opens.description=Обновляет \\&lt;module\\&gt; для открытия \\&lt;package\\&gt; для \\&lt;target-module\\&gt;, независимо от объявления модуля.
vm.option.add.reads.description=Обновляет \\&lt;module\\&gt; для чтения \\&lt;target-module\\&gt;, независимо от объявления модуля. \\&lt;target-module\\&gt; может быть ALL-UNNAMED для чтения всех неназванных модулей.
vm.option.advanced.option.description=Указывает нестандартную опцию, специфичную для JVM.
vm.option.agentlib.description=Загружает библиотеку нативного агента по \\&lt;libname\\&gt;.
vm.option.agentpath.description=Загружает библиотеку нативного агента по \\&lt;pathname\\&gt;.
vm.option.batch.description=Отключает фоновую компиляцию.
vm.option.bootclasspath.a.description=Добавляет в конец пути загрузки классов.
vm.option.bootclasspath.description=Устанавливает путь поиска для загрузочных классов и ресурсов.
vm.option.bootclasspath.p.description=Добавляет в начало пути загрузки классов.
vm.option.check.jni.description=Выполняет дополнительные проверки для функций JNI.
vm.option.comp.description=Принудительная компиляция методов при первом вызове.
vm.option.debug.description=Ничего не делает. Предоставлено для обратной совместимости.
vm.option.diag.description=Показывает дополнительные диагностические сообщения.
vm.option.disable.assertions.description=Включает утверждения с указанной степенью детализации.
vm.option.disable.files.description=Отключает дальнейшее расширение файла аргументов.
vm.option.disable.system.assertions.description=Отключает системные утверждения.
vm.option.enable.assertions.description=Включает утверждения с указанной степенью детализации.
vm.option.enable.system.assertions.description=Включает системные утверждения.
vm.option.finalization.description=Управляет тем, выполняет ли JVM финализацию объектов, где \\&lt;value\\&gt; может быть "enabled" или "disabled". Финализация включена по умолчанию.
vm.option.future.description=Включает самые строгие проверки, предвосхищая будущие настройки по умолчанию. Этот параметр устарел и может быть удален в будущих версиях.
vm.option.illegal.access.description=Разрешает или запрещает доступ к членам типов в именованных модулях кодом в неназванных модулях. \\&lt;value\\&gt; может быть "deny", "permit", "warn" или "debug". Эта опция будет удалена в будущих выпусках.
vm.option.incgc.description=Включает инкрементный сборщик мусора.
vm.option.int.description=Запускает приложение только в интерпретируемом режиме.
vm.option.internalversion.description=Отображает более подробную информацию о версии JVM, чем опция -version.
vm.option.javaagent.description=Загружает агент языка программирования Java по \\&lt;jarpath\\&gt;.
vm.option.limit.modules.description=Ограничивает множество наблюдаемых модулей.
vm.option.log.description=Настраивает или включает ведение журнала с использованием единой системы ведения журнала Java Virtual Machine (JVM). Используйте -Xlog\:help для получения подробной информации.
vm.option.loggc.description=Записывает статус GC в файл с временными метками. Этот параметр устарел и может быть удален в будущих версиях. Он заменен на -Xlog\:gc\:\\&lt;file\\&gt;.
vm.option.mixed.description=Смешанный режим выполнения (по умолчанию).
vm.option.mn.description=Устанавливает начальный и максимальный размер (в байтах) кучи для молодого поколения (ясли).
vm.option.ms.description=Устанавливает начальный размер кучи Java.
vm.option.mx.description=Устанавливает максимальный размер кучи Java.
vm.option.noclassgc.description=Отключает сборку мусора для классов.
vm.option.patch.module.description=Переопределяет или дополняет модуль классами и ресурсами в JAR-файлах или каталогах.
vm.option.prof.description=Выводит данные профилирования процессора.
vm.option.rs.description=Уменьшает использование сигналов ОС Java/VM (см. документацию).
vm.option.share.auto.description=Использует общие данные классов, если это возможно (по умолчанию).
vm.option.share.off.description=Не пытается использовать общие данные классов.
vm.option.share.on.description=Требует использования общих данных классов, в противном случае завершает работу. Это тестовая опция и может привести к периодическим сбоям. Не следует использовать в производственных средах.
vm.option.showSettings.all.description=Показывает все настройки и продолжает.
vm.option.showSettings.description=Показывает все настройки и продолжает.
vm.option.showSettings.locale.description=Показывает все настройки, связанные с локалью, и продолжает.
vm.option.showSettings.properties.description=Показывает все настройки свойств и продолжает.
vm.option.showSettings.system.description=(Только для Linux) Показывает конфигурацию хост-системы или контейнера и продолжает.
vm.option.showSettings.vm.description=Показывает все настройки, связанные с vm, и продолжает.
vm.option.source.description=Устанавливает \\&lt;version\\&gt; исходного кода в режиме исходного файла.
vm.option.ss.description=Устанавливает размер стека потока Java. Фактический размер может быть округлен до кратного размера страницы системы, как того требует операционная система.
vm.option.system.property.description=Устанавливает системное свойство в формате \\&lt;name\\&gt;\=\\&lt;value\\&gt;.
vm.option.verify.description=Устанавливает режим проверки байт-кода. Обратите внимание, что параметр -Xverify\:none устарел и может быть удален в будущих версиях.
