readme.conclusion.header=Вернитесь к вашему проекту
readme.exit.options=Чтобы вернуться на экран приветствия, просто закройте окно проекта. Кроме того, вы можете выбрать `{0} | {1}` в главном меню. Также вы можете использовать меню `{0}` для открытия или создания новых проектов. По умолчанию окно инструментов `{2}` скрыто. Вы можете открыть его, выбрав `{3} | {4}` в главном меню.
readme.experienced.users.remark=Даже если урок кажется вам знакомым, попробуйте его\: вы можете обнаружить полезные примеры и неизвестные ярлыки функций, которые вы активно используете\!
readme.feedback.request=Мы будем признательны, если вы оставите отзыв об этом учебном курсе\!
readme.ift.description=Этот интерактивный курс проведет вас через множество рабочих процессов и вариантов использования IDE. Он содержит множество полезных ярлыков действий. Вам не нужно запоминать их все. Вместо этого попробуйте их и возьмите на вооружение самые полезные. Поскольку в повседневной работе вы можете столкнуться с новыми проблемами, возвращайтесь к этому курсу и попробуйте другие функции еще раз. Следите за новыми уроками, которые помогут вам быть более продуктивными с {0}.
readme.indexing.description=Вы, вероятно, читаете этот `README.md` во время инициализации учебного проекта. Обычно `индексация` является самой времязатратной операцией во время инициализации проекта. IDE потребуется собрать информацию о вашей среде, проекте{0,choice,1\#, библиотеках|2\#}, и создать внутреннее представление. Это необходимо для быстрой навигации и поиска.
readme.navigation.hint=Модуль `{0}` в этом курсе покажет, как его использовать.
readme.shortcuts.header=Управление ярлыками
readme.shortcuts.problem.description=Некоторые сочетания клавиш в этом курсе могут конфликтовать с системными или другими сочетаниями клавиш приложений. В этом случае вы можете нажать на проблемное сочетание клавиш в тексте урока. Открывшееся всплывающее окно покажет вам название действия и альтернативные сочетания клавиш. Вы сможете применить действие или назначить новое сочетание клавиш.
readme.start.header=Начать работу
readme.toolwindow.description=Окно инструмента `{0}` содержит несколько модулей с соответствующими наборами уроков, которые вы можете проходить в любом порядке. Когда вы закончите изучение урока, он будет отмечен как завершенный. Вы можете использовать завершенный урок для справки или перезапустить его, если хотите освежить свои знания.
