libraries.node.text.ide=Библиотеки содержат классы, которые добавляют различную функциональность вашим приложениям. Библиотеки также включают исходные файлы и JavaDocs, которые могут помочь вам в разработке ваших проектов.<br><br>IntelliJ IDEA использует библиотеки для помощи в автозаполнении кода, проверке, выделении ошибок и т.д.<br><br>Глобальные библиотеки доступны во всем проекте и могут использоваться всеми модулями. Также они доступны для всех проектов, созданных локально на вашем компьютере.<br><br>Обратите внимание, что глобальные библиотеки недоступны для тех, с кем вы делитесь проектом. Если вы делитесь проектом с командой, используйте проектные библиотеки.<br><br>Разверните узел и выберите дочерние элементы для управления глобальными библиотеками.<br><br>Чтобы прикрепить библиотеку к модулю, выберите этот модуль, нажмите вкладку Зависимости, нажмите Добавить и укажите расположение библиотеки.
libraries.node.text.module=Библиотеки содержат классы, которые добавляют различную функциональность вашим приложениям. Библиотеки также включают исходные файлы и JavaDocs, которые могут помочь вам в разработке ваших проектов.<br><br>IntelliJ IDEA использует библиотеки для помощи в автозаполнении кода, проверке, выделении ошибок и т.д.<br><br>Модульные библиотеки ссылаются только из модуля, к которому они прикреплены. Разверните узел и выберите дочерние элементы для управления модульными библиотеками.<br><br>Чтобы прикрепить библиотеку к модулю, выберите этот модуль, нажмите вкладку Зависимости, нажмите Добавить и укажите расположение библиотеки.
libraries.node.text.project=Библиотеки содержат классы, которые добавляют различную функциональность вашим приложениям. Библиотеки также включают исходные файлы и JavaDocs, которые могут помочь вам в разработке ваших проектов.<br><br>IntelliJ IDEA использует библиотеки для помощи в автозаполнении кода, проверке, выделении ошибок и т.д.<br><br>Проектные библиотеки доступны во всем проекте и могут использоваться всеми модулями. Также они доступны всем, с кем вы делитесь проектом.<br><br>Разверните узел и выберите дочерние элементы для управления проектными библиотеками.<br><br>Чтобы прикрепить библиотеку к модулю, выберите этот модуль, нажмите вкладку Зависимости, нажмите Добавить и укажите расположение библиотеки.
