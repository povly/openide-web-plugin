zen.coding.context.help.tooltip=Оборачивает текст в HTML, сгенерированный сокращением Emmet. Он расширяет сокращение и помещает выбранное содержимое в последний элемент сгенерированного фрагмента.\n<p/>\nВы можете определить позицию вывода, используя заполнитель <code>$\#</code>.
