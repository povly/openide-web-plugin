notification.gradle.legacy.firstLoad=Подсказки кода отключены, чтобы избежать конфигурации сборки Gradle.
notification.gradle.legacy.firstLoad.info=<div width\=400><p>Для получения конфигурации скрипта необходимо выполнить фазу конфигурации Gradle. Загрузка конфигурации скрипта отключена по умолчанию, так как это может быть ресурсоемким для больших проектов Gradle.</p><p>Нажмите "Загрузить конфигурацию", чтобы оценить скрипт Gradle Kotlin DSL.</p><p>В качестве альтернативы, чтобы автоматически загружать конфигурацию при первом открытии скрипта и перезагружать её каждый раз при изменении блоков конфигурации сборки скрипта, вы можете включить "автоперезагрузку" для всех скриптов. Этот вариант не рекомендуется для больших проектов Gradle с длительным временем конфигурации.</p></div>
notification.gradle.legacy.outsideProject=Подсказки кода недоступны (связанный проект Gradle не связан).
notification.gradle.legacy.outsideProject.addToStandaloneHelp=<div width\=400><p>Gradle проект, который оценивает этот скрипт, необходимо импортировать, чтобы он был проанализирован IDE. Попробуйте повторно импортировать связанный проект Gradle или свяжите новый проект Gradle, который оценивает этот скрипт.</p><p>В качестве альтернативы, вы можете добавить его в отдельные скрипты, и его конфигурация будет загружена автоматически.</p><p><b>ПРИМЕЧАНИЕ\:</b> Каждый отдельный скрипт требует отдельной фазы конфигурации Gradle для выполнения при обновлении. Это может быть ресурсоемким для больших проектов Gradle.</p></div>
notification.gradle.legacy.standalone.info=<div width\=400><p>Gradle проект, который оценивает этот скрипт, не импортирован в IDE. <br/><p><b>ПРИМЕЧАНИЕ\:</b> Каждый отдельный скрипт требует отдельной фазы конфигурации Gradle для выполнения при обновлении. Это может быть ресурсоемким для больших проектов Gradle.</p></div>
notification.notEvaluatedInLastImport.addAsStandaloneAction=Добавить в автономные скрипты
notification.notEvaluatedInLastImport.info=<div width\=400><p>Gradle проект, который оценивает этот скрипт, необходимо импортировать, чтобы он был проанализирован IDE. Попробуйте повторно импортировать связанный проект Gradle или свяжите новый проект Gradle, который оценивает этот скрипт.</p><p>В качестве альтернативы, вы можете добавить его в отдельные скрипты, и его конфигурация будет загружена отдельно.</p><p><b>ПРИМЕЧАНИЕ\:</b> Каждый отдельный скрипт требует отдельной фазы конфигурации Gradle для выполнения при обновлении. Это может быть ресурсоемким для больших проектов Gradle.</p></div>
