relaxng.convert-schema.advanced-options.dtd.tooltip.annotation-prefix=Значения по умолчанию представлены с использованием аннотационного атрибута prefix\:defaultValue, где prefix связан с http\://relaxng.org/ns/compatibility/annotations/1.0, как определено спецификацией комитета по совместимости RELAX NG DTD. По умолчанию Trang будет использовать a для префикса, если это не конфликтует с префиксом, используемым в DTD.
relaxng.convert-schema.advanced-options.dtd.tooltip.any-name=Указывает имя определения, созданного для содержимого элементов, объявленных в DTD как имеющих модель содержимого ANY.
relaxng.convert-schema.advanced-options.dtd.tooltip.attlist-define=Это указывает, как создать имя определения, представляющего объявление списка атрибутов, из имени элемента. Шаблон имени должен содержать ровно один символ процента. Этот символ процента заменяется именем элемента (после замены двоеточия), и результат используется как имя определения.
relaxng.convert-schema.advanced-options.dtd.tooltip.colon-replacement=Заменяет двоеточия в именах элементов символами при построении имен определений, используемых для представления объявлений элементов и объявлений списков атрибутов в DTD. Trang генерирует определение для каждого объявления элемента и объявления списка атрибутов в DTD. Имя определения основано на имени элемента. В RELAX NG имена определений не могут содержать двоеточия. Однако в DTD имя элемента может содержать двоеточие. По умолчанию Trang сначала попытается использовать имена элементов без префиксов. Если это вызовет конфликт, он вместо этого заменит двоеточие на допустимый символ имени (сначала он попытается использовать точку).
relaxng.convert-schema.advanced-options.dtd.tooltip.element-define=Указывает, как создать имя определения, представляющего объявление элемента, из имени элемента. Шаблон имени должен содержать ровно один символ процента. Этот символ процента заменяется именем элемента (после замены двоеточия), и результат используется как имя определения.
relaxng.convert-schema.advanced-options.dtd.tooltip.generate-start=Указывает, должен ли Trang генерировать начальный элемент. DTD не указывает, какие элементы разрешены в качестве элементов документа. Trang предполагает, что все элементы, которые определены, но никогда не упоминаются, разрешены в качестве элементов документа.
relaxng.convert-schema.advanced-options.dtd.tooltip.inline-attlist=Указывает не генерировать определения для объявлений списков атрибутов и вместо этого перемещать атрибуты, объявленные в списках атрибутов, в определения, сгенерированные для объявлений элементов. Это поведение по умолчанию, когда выходной модуль - xsd. В противном случае поведение по умолчанию описано в параметре -i no-inline-attlist.
relaxng.convert-schema.advanced-options.dtd.tooltip.strict-any=Сохраняет точную семантику моделей содержимого ANY, используя явный выбор ссылок на все объявленные элементы. По умолчанию Trang использует подстановочный знак, который позволяет использовать любой элемент.
relaxng.convert-schema.advanced-options.xsd.border-title.w3c-xml-schema-output=Вывод схемы W3C XML
relaxng.convert-schema.advanced-options.xsd.checkbox.disable-abstract-elements=отключить-абстрактные-элементы (&D)
relaxng.convert-schema.advanced-options.xsd.label.any-attribute-process-contents=any-attribute-process-contents (&N)
relaxng.convert-schema.advanced-options.xsd.label.any-process-contents=any-process-contents (&A)
relaxng.convert-schema.advanced-options.xsd.tooltip.any-attribute-process-contents=Указывает значение для атрибута processContents любых элементов Attribute. \nПо умолчанию пропуск (соответствует семантике RELAX NG).
relaxng.convert-schema.advanced-options.xsd.tooltip.any-process-contents=Указывает значение для атрибута processContents любых элементов. \nПо умолчанию пропуск (соответствует семантике RELAX NG), если \nвходной формат не dtd, в этом случае по умолчанию строго (соответствует \nсемантике DTD).
relaxng.convert-schema.advanced-options.xsd.tooltip.disable-abstract-elements=Отключает использование абстрактных элементов и групп замещения в сгенерированной XML-схеме. Это также можно контролировать с помощью атрибута аннотации.
