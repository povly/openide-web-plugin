dirdiff.filter.help.description=<p>Чтобы включить файлы, введите соответствующий шаблон.</p><p>Чтобы исключить файлы, добавьте <code>\!</code> перед вашим шаблоном.</p><p>Используйте <code>\\&</code> и <code>|</code> для объединения нескольких фильтров с помощью операций <code>AND<code/> и <code>OR<code/> соответственно. </p><p><b>Примеры\:</b></p><ul><li><code>*.txt</code> проверяет все пути, которые заканчиваются на .txt.</li><li><code>\!build/*</code> исключает все файлы, которые находятся в каталоге <code>build</code>.</li><li><code>*.txt\\&\!build/*</code> проверяет все пути, которые заканчиваются на <code>.txt</code> и не находятся в каталоге <code>build</code>.</li></ul>
