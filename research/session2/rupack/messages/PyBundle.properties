inlay.parameters.python.hints.blacklist.explanation=<p>Чтобы отключить подсказки для метода или функции, используйте один из следующих шаблонов\:</p><ul><li><code><b>(*info)</b></code> - все функции с одним параметром, имя которого заканчивается на <em>info</em><br></li><li><code><b>(a, b)</b></code> - все функции с параметрами <em>a</em> и <em>b</em><br></li><li><code><b>*.put(self, key, value)</b></code> - все методы <em>put</em> с параметрами <em>key</em> и <em>value</em><br></li><li><code><b>Foo.bar(self, a, b)</b></code> - метод <em>bar</em> класса <em>Foo</em> с параметрами <em>a</em> и <em>b</em><br></li><li><code><b>foo(\\&lt;star\\&gt;\\&lt;star\\&gt;kwargs)</b></code> - функция <em>foo</em> с параметром <em>**kwargs</em><br></li></ul><p>Имена или заполнители должны быть указаны для всех параметров, включая необязательные.<br>Квалифицированные имена методов должны включать имена классов или заполнители для них.<br>Используйте действие "Не показывать подсказки для текущего метода" {0}, чтобы добавить шаблоны из редактора.</p>
