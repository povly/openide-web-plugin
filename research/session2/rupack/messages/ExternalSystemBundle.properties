environment.key.description.link.unlinked.project=Определяет, должен ли IDE импортировать информацию о проекте из доступных скриптов сборки.\nФормат значений - это либо 'all', либо список, разделенный запятыми, с элементами вида '<Система сборки>\:[import|skip]'.\n- Если указано 'all', то все обнаруженные скрипты сборки используются для импорта\n- Если указано '<Система сборки>\:import', то скрипты сборки этой системы будут использоваться для процесса импорта.\n- Если указано '<Система сборки>\:skip', то скрипты сборки не будут использоваться, и уведомление об использовании этих скриптов не будет показано в интерфейсе IDE.\nПример значения для этого ключа\: "Gradle\:import,Ant\:skip"
